name: Build SysMon TrollStore IPA

on:
  workflow_dispatch:

env:
  XCODE_VERSION: "15.4"

jobs:
  build:
    name: Build floating CPU/RAM/Net monitor IPA
    runs-on: macos-latest
    steps:
      - name: Setup Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Install build dependencies
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK=1 brew install dpkg make libplist openssl@3 ldid-procursus
          echo "/usr/local/opt/make/libexec/gnubin" >> $GITHUB_PATH

      - name: Checkout source (with CPU/RAM patch already applied)
        uses: actions/checkout@v4
        with:
          path: TrollSpeed
          submodules: recursive

      - name: Verify patch is present
        run: |
          cd $GITHUB_WORKSPACE/TrollSpeed
          echo "=== CPU/RAM patch check ==="
          grep -c "formattedSystemString" sources/HUDRootViewController.mm
          echo "PKG_VERSION=$(./get-version.sh)" >> $GITHUB_ENV
          ./gen-control.sh

      - name: Checkout roothide/theos
        uses: actions/checkout@v4
        with:
          repository: roothide/theos
          path: theos
          submodules: recursive

      - name: Add THEOS environment variables
        run: |
          rm -rf $GITHUB_WORKSPACE/theos/sdks
          echo "THEOS=$GITHUB_WORKSPACE/theos" >> $GITHUB_ENV

      - name: Checkout theos/sdks
        uses: actions/checkout@v4
        with:
          repository: theos/sdks
          ref: master
          path: ${{ env.THEOS }}/sdks

      - name: Build tipa with Xcode
        run: |
          cd $GITHUB_WORKSPACE/TrollSpeed
          ./build.sh

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: SysMon_${{ env.PKG_VERSION }}
          path: |
            TrollSpeed/packages/TrollSpeed+AppIntents16_*.tipa
            TrollSpeed/packages/TrollSpeed_*.tipa
          if-no-files-found: error
